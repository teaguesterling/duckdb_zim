site_name: duckdb_zim
site_description: Read .zim (Kiwix / openZIM) archives directly in DuckDB via libzim.
site_url: https://duckdb-zim.readthedocs.io/
repo_url: https://github.com/teaguesterling/duckdb_zim
repo_name: teaguesterling/duckdb_zim

# Built-in theme that ships with mkdocs — no third-party theme dependency, which keeps
# the Read the Docs build dependency-light and reliable.
theme:
  name: readthedocs
  highlightjs: true

# Core Python-Markdown extensions only (all bundled with mkdocs — no extra packages).
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - fenced_code
  - codehilite
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Installation: installation.md
  - Reading archives: reading.md
  - The zim:// filesystem: filesystem.md
  - Search & suggestions: search.md
  - Writing archives: writing.md
  - Function reference: reference.md
  - Recipes: recipes.md
  - Design notes: design.md
  - libzim semantics: libzim-semantics.md

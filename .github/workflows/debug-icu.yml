#
# TEMPORARY debug: reproduce the pipeline's icu failure by running `make release` in a
# NON-login shell (like the real pipeline) vs a login shell (which activates
# gcc-toolset-14). Dumps icu's make-all logs to capture the hidden error. Remove after.
#
name: Debug icu build
on:
  workflow_dispatch:
  push:
    branches:
      - feat/phase-1-zim-reader

jobs:
  icu:
    name: Reproduce icu failure (non-login shell)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'true'
      - name: Build the CI docker image
        run: |
          docker build \
            --build-arg vcpkg_url=https://github.com/microsoft/vcpkg.git \
            --build-arg vcpkg_commit=84bab45d415d22042bd0b9081aea57f362da3f35 \
            -t ci_img extension-ci-tools/docker/linux_amd64
      - name: make release in a NON-login shell (matches the pipeline) + dump logs
        run: |
          docker run --rm \
            -e VCPKG_TARGET_TRIPLET=x64-linux-release \
            -e VCPKG_HOST_TRIPLET=x64-linux-release \
            -e VCPKG_OVERLAY_PORTS=/duckdb_build_dir/extension-ci-tools/vcpkg_ports \
            -e VCPKG_OVERLAY_TRIPLETS=/duckdb_build_dir/extension-ci-tools/toolchains \
            -e VCPKG_BINARY_SOURCES=clear \
            -e BUILD_SHELL=0 \
            -v "$PWD:/duckdb_build_dir" \
            ci_img bash -c '
              cd /duckdb_build_dir
              git config --global --add safe.directory "*"
              echo "=== LD_LIBRARY_PATH (non-login): [$LD_LIBRARY_PATH]"
              echo "=== which cc: $(which cc); ldd of a gcc-toolset binary:"
              make release > /tmp/b.log 2>&1
              echo "EXIT=$?"
              echo "===== BUILD LOG TAIL ====="; tail -15 /tmp/b.log
              echo "===== icu make-all OUT (grep runtime/loader errors) ====="
              find / -name "make-all-*-rel-out.log" 2>/dev/null -exec grep -iE "GLIBCXX|error while loading|cannot open shared|version .* not found|Error|fatal" {} \; | tail -40
              echo "===== icu make-all ERR (tail) ====="
              find / -name "make-all-*-rel-err.log" 2>/dev/null -exec tail -60 {} \;
            '

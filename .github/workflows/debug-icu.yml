#
# TEMPORARY debug workflow: build the exact duckdb CI image (manylinux/gcc-toolset-14),
# reproduce the icu vcpkg build on the release-only triplet, and dump the buildtree error
# log that the normal pipeline does not surface. Remove once the icu/Linux build is fixed.
#
name: Debug icu build
on:
  workflow_dispatch:
  push:
    branches:
      - feat/phase-1-zim-reader

jobs:
  icu:
    name: Reproduce icu build in CI image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'true'
      - name: Build the CI docker image (manylinux + gcc-toolset-14 + vcpkg)
        run: |
          docker build \
            --build-arg vcpkg_url=https://github.com/microsoft/vcpkg.git \
            --build-arg vcpkg_commit=84bab45d415d22042bd0b9081aea57f362da3f35 \
            -t ci_img extension-ci-tools/docker/linux_amd64
      - name: Build the FULL libzim[xapian] dep set + watch disk
        run: |
          echo "===== runner disk BEFORE ====="; df -h / /mnt 2>/dev/null
          docker run --rm ci_img bash -lc '
            set -x
            cd /vcpkg
            echo "===== container disk BEFORE ====="; df -h /
            ./vcpkg install "libzim[core,xapian]:x64-linux-release" > /tmp/inst.log 2>&1 || true
            echo "===== container disk AFTER ====="; df -h /
            echo "========== INSTALL LOG (tail) =========="
            tail -60 /tmp/inst.log
            echo "========== icu make-all err (No space?) =========="
            tail -80 buildtrees/icu/make-all-x64-linux-release-rel-err.log 2>/dev/null || echo "(no icu err log)"
            echo "========== xapian err (tail) =========="
            tail -40 buildtrees/xapian/*err*.log 2>/dev/null | tail -40 || echo "(no xapian err log)"
          '
          echo "===== runner disk AFTER ====="; df -h / /mnt 2>/dev/null

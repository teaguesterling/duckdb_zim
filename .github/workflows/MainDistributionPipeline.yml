#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  # github.event_name is part of the key on purpose. Without it a push to a
  # branch and a workflow_dispatch on that same branch collide: same ref, same
  # sha, both with empty head_ref/base_ref. cancel-in-progress then kills the
  # push run every time the canary is dispatched by hand, and a cancelled run
  # reads as a failed one on the checks dashboard.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  # Forward-compat canary: builds this extension's sources against duckdb `main`,
  # which is the v2.0 line (v2.0-cyanoptera). duckdb/community-extensions builds
  # every release PR against v2.0 via build_next.yml, with no per-extension opt-out
  # -- so an extension that stops compiling there has a red check on every release.
  # This job is where that breakage is found, on demand, instead of in a release PR.
  #
  # Informational, NOT a merge blocker: merge-readiness is judged on the stable
  # v1.5.4 build below, which is what this extension ships. Expected to go red
  # whenever upstream drifts; do not pin it.
  #
  # Gated with `if:` and not `continue-on-error:` -- a job that calls a REUSABLE
  # workflow accepts only a fixed set of keys, and adding continue-on-error makes
  # the whole file fail to parse, scheduling zero jobs. The gate also keeps the
  # canary off pull_request runs, where a red advisory leg would sit in every PR's
  # check rollup.
  duckdb-next-build:
    name: Canary — build against DuckDB main (advisory)
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@main
    with:
      duckdb_version: main
      ci_tools_version: main
      extension_name: zim
      vcpkg_binary_sources: 'clear'
      # linux_amd64 only. The canary answers exactly one question -- "do these
      # sources still compile against the v2.0 API?" -- and that answer is
      # arch-independent, while every extra arch means another from-source build of
      # libzim + xapian + icu (this extension's vcpkg set is expensive; see the
      # 'clear' above). Keeping it to one arch is what makes the port loop minutes
      # rather than an hour. The stable job below still covers the full matrix.
      exclude_archs: 'linux_arm64;linux_amd64_musl;linux_arm64_musl;osx_amd64;osx_arm64;windows_amd64;windows_arm64;windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads'

  duckdb-stable-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5-variegata
    with:
      duckdb_version: v1.5.4
      ci_tools_version: v1.5-variegata
      extension_name: zim
      # Disable the shared DuckDB binary cache: it hands back an icu (or host-tool)
      # artifact built with an incompatible toolchain, which poisons the icu build under
      # gcc-toolset-14 (the build fails only when the cache is consulted; a fresh build
      # of every dep succeeds). 'clear' forces building all deps from source.
      vcpkg_binary_sources: 'clear'
      # Windows isn't supported yet: libzim + xapian under MSVC/mingw need their own porting
      # work (mingw in particular fails to build the deps -- xapian's configure fails with
      # "C compiler cannot create executables" under the rtools mingw toolchain). Ships
      # Linux + macOS; revisit Windows later. (Wasm is likewise a documented open question.)
      exclude_archs: 'windows_amd64;windows_arm64;windows_amd64_mingw'

  code-quality-check:
    name: Code Quality Check
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@v1.5-variegata
    with:
      duckdb_version: v1.5.4
      ci_tools_version: v1.5-variegata
      extension_name: zim
      # format only: the tidy check configures CMake without vcpkg, so this extension's
      # required libzim (pkg-config) isn't found and tidy can't even configure.
      format_checks: 'format'

  # Guards the LINKED_LIBS class of WASM bug: the distribution workflow builds and
  # uploads the .wasm but never inspects or loads it, so a side module with unresolved
  # libzim/zstd/lzma symbols ships green. This downloads the v1.5.4 wasm artifacts and
  # statically checks no dependency symbol is imported-but-undefined (no runtime needed).
  # See test/wasm/. (A live duckdb-wasm load test is deferred until runtime ZIM reading
  # in wasm lands — libzim's local mmap path doesn't work in wasm.)
  wasm-symbol-check:
    name: WASM symbol resolution check
    needs: [duckdb-stable-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Download WASM artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: zim-v1.5.4-extension-wasm_*
          path: wasm-artifacts
      - name: Check for unresolved libzim/zstd/lzma symbols
        run: bash test/wasm/run_wasm_checks.sh wasm-artifacts

  # Remote full-text search can't be a sqllogictest (no server host), so run the
  # test/remote/remote_search.sh integration test against the built linux artifact +
  # a matching DuckDB CLI: serve the committed test.zim over http and assert a remote
  # zim_search returns the same hits as the local search (the reader-copy path).
  #
  # EVERY ARTIFACT IS TESTED, EACH WITH THE SHELL IT WAS BUILT AGAINST. This job used
  # to download every "*linux_amd64*" artifact and then test whichever one `find`
  # happened to return first, against a hardcoded v1.5.4 shell. That was harmless
  # while the stable build was the only artifact -- but once main grew a DuckDB-main
  # canary, a second artifact appeared and `find` picked it roughly at random. A
  # DuckDB-main extension cannot load into a v1.5.4 shell (an extension loads only
  # into the exact DuckDB it was built against), so the load failed, every query
  # returned nothing, and the script reported "missing expected hit" -- an ABI
  # mismatch wearing the costume of a silent wrong answer in remote search.
  #
  # So: iterate the artifacts explicitly, and derive each one's shell rather than
  # assuming. The distribution workflow ships a test-support bundle containing the
  # duckdb binary built from that same source tree, which is matching BY
  # CONSTRUCTION; use it when present and fall back to the released CLI named in the
  # artifact otherwise. If neither can be resolved, FAIL rather than test the wrong
  # pair. remote_search.sh itself now refuses to run before the extension loads and
  # httpfs installs, so the two environment failures can no longer masquerade as
  # missing search hits.
  remote-search-test:
    name: Remote search integration test
    # Waits for the canary too, so its artifact is present rather than racing it --
    # otherwise "which artifacts exist" depends on job timing. always() is required
    # because the canary is SKIPPED on pull_request and on non-main pushes, and a
    # skipped dependency would otherwise skip this job with it.
    needs: [duckdb-stable-build, duckdb-next-build]
    if: always() && needs.duckdb-stable-build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download linux extension artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*linux_amd64*"
          path: ext-artifacts
      - name: Fetch released DuckDB CLI (v1.5.4)
        run: |
          set -euo pipefail
          curl -fL -o duckdb.zip https://github.com/duckdb/duckdb/releases/download/v1.5.4/duckdb_cli-linux-amd64.zip
          unzip -o duckdb.zip -d duckdb-cli
          ./duckdb-cli/duckdb --version
      - name: Run remote search + stdout guards against every artifact
        run: |
          set -euo pipefail
          shopt -s nullglob
          tested=0
          for artdir in ext-artifacts/*/; do
            name="$(basename "$artdir")"
            ext="$(find "$artdir" \( -name 'zim.duckdb_extension' -o -name 'zim.duckdb_extension.gz' \) | head -1)"
            if [ -z "$ext" ]; then
              echo "::notice::$name carries no zim.duckdb_extension, skipping"
              continue
            fi
            if [ "${ext##*.}" = "gz" ]; then gunzip -kf "$ext"; ext="${ext%.gz}"; fi
            ext="$(readlink -f "$ext")"

            # Resolve the shell this artifact can actually load into.
            cli=""
            ts="$(find "$artdir" -name 'test-support.tar.gz' | head -1)"
            if [ -n "$ts" ]; then
              dest="shells/$name"
              mkdir -p "$dest"
              # The bundle is built from the same tree as the extension, so its
              # duckdb binary matches by construction whatever version that was.
              tar xzf "$ts" -C "$dest" release/duckdb
              cli="$(readlink -f "$dest/release/duckdb")"
            elif [[ "$name" == *v1.5.4* ]]; then
              cli="$PWD/duckdb-cli/duckdb"
            else
              echo "::error::no DuckDB shell available for artifact '$name'; refusing to test it against a mismatched shell"
              exit 1
            fi

            echo "=============================================================="
            echo "artifact:  $name"
            echo "extension: $ext"
            echo "shell:     $cli ($("$cli" --version))"
            echo "=============================================================="
            DUCKDB_BIN="$cli" ZIM_EXTENSION="$ext" bash test/remote/remote_search.sh
            # #21 guard: searching a no-stemmer-language archive must not leak
            # libzim's "No stemming ..." line to stdout (sqllogictest can't see stdout).
            # Needs no httpfs, so it runs on every artifact including the canary's.
            DUCKDB_BIN="$cli" ZIM_EXTENSION="$ext" bash test/no_stdout_pollution.sh
            # Writer counterpart of the #21 guard above: writing a ZIM must not leak
            # libzim's writer-side INFO() prints to stdout either.
            DUCKDB_BIN="$cli" ZIM_EXTENSION="$ext" bash test/no_writer_stdout_pollution.sh
            tested=$((tested + 1))
          done
          if [ "$tested" -eq 0 ]; then
            echo "::error::no artifact was tested"; find ext-artifacts -type f | head -50; exit 1
          fi
          echo "artifacts tested: $tested"

  # The parallel read_zim scan reads one shared libzim Archive from many threads
  # (see DESIGN.md). A ThreadSanitizer build of the extension runs the many-entry
  # parallel scan test (test/sql/zim_parallel.test, >4096 entries = multiple
  # in-flight morsels) to catch a data race in that concurrent read. Only the zim
  # extension + DuckDB are instrumented; the vcpkg deps are not (enough to catch
  # races in this codebase's own concurrency).
  thread-sanitizer:
    name: Thread sanitizer (parallel scan)
    runs-on: ubuntu-latest
    env:
      GEN: ninja
      THREADSAN: 1
      VCPKG_TARGET_TRIPLET: x64-linux
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake build-essential ccache pkg-config \
                                  autoconf automake autoconf-archive libtool zip unzip curl
      - name: Setup vcpkg
        run: |
          mkdir local_vcpkg_installation && cd local_vcpkg_installation
          git init
          git remote add origin https://github.com/microsoft/vcpkg.git
          git fetch --depth 1 origin 84bab45d415d22042bd0b9081aea57f362da3f35
          git checkout 84bab45d415d22042bd0b9081aea57f362da3f35
          ./bootstrap-vcpkg.sh
          echo "VCPKG_TOOLCHAIN_PATH=$PWD/scripts/buildsystems/vcpkg.cmake" >> "$GITHUB_ENV"
      - name: Build extension with ThreadSanitizer
        run: make release
      - name: Run parallel-scan test under ThreadSanitizer
        env:
          # Suppress libzim's own (mutex-guarded but uninstrumented) internal-cache
          # races; a race in this extension's code still fails. halt_on_error=1 so a
          # real race aborts the job.
          TSAN_OPTIONS: "halt_on_error=1 suppressions=${{ github.workspace }}/test/tsan.supp"
        # setarch -R disables ASLR: modern kernels randomize enough that tsan
        # otherwise aborts at startup with "unexpected memory mapping".
        run: setarch "$(uname -m)" -R ./build/release/test/unittest "test/sql/zim_parallel.test"

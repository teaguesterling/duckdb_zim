#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  # github.event_name is part of the key on purpose. Without it a push to a
  # branch and a workflow_dispatch on that same branch collide: same ref, same
  # sha, both with empty head_ref/base_ref. cancel-in-progress then kills the
  # push run every time the canary is dispatched by hand, and a cancelled run
  # reads as a failed one on the checks dashboard.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  # THE NEXT LINE, first-class. duckdb/community-extensions builds every descriptor
  # that carries ref_next against `v2.0-cyanoptera` (build_next.yml), so a PR is not
  # green here until it builds and tests there too. This was the canary until
  # 2026-09-13; Teague's dual-line ruling removed its gate. Note v2.0-cyanoptera is a
  # BRANCH, not a tag: a red here can arrive on a push none of us made. The case for
  # gating on it is relevance, not reproducibility -- it is the line the registry
  # builds, and DuckDB `main` has diverged from it (webbed's `main` canary stayed
  # green over a ConstantExpression call that cyanoptera deletes).
  #
  # MATRIX WIDTH, zim-specific: reduced_ci_mode defaults to `auto` (three arches on
  # pull requests, the full matrix on pushes), but exclude_archs below narrows this
  # job to linux_amd64 on PRs AND pushes. Every extra arch is another from-source
  # libzim + xapian + icu build under vcpkg_binary_sources 'clear' (about an hour
  # each), Windows cannot build libzim/xapian at all, and the xapian source host has
  # timed out more than once. Widen this only once a vcpkg asset cache exists; the
  # stable job below still covers the full matrix.
  #
  # ONCE PER PR, ONCE PER MERGE. A push to a PR branch fires a push run AND a
  # pull_request run for the same commit, so an ungated job here builds twice per
  # push (markdown, measured on 126739d). This gate runs it on every pull request,
  # on merges to main, and on dispatch; the one case it does not cover is a branch
  # with no PR open, which gets its first next-line build when the PR opens.
  duckdb-next-build:
    name: Build extension binaries (duckdb next, v2.0 line)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@main
    with:
      duckdb_version: v2.0-cyanoptera
      ci_tools_version: main
      extension_name: zim
      vcpkg_binary_sources: 'clear'
      # linux_amd64 only. This job answers one question -- "do these sources
      # still build and test on the v2.0 line?" -- and that answer is
      # arch-independent, while every extra arch means another from-source build of
      # libzim + xapian + icu (this extension's vcpkg set is expensive; see the
      # 'clear' above). Keeping it to one arch is what makes the port loop minutes
      # rather than an hour. The stable job below still covers the full matrix.
      exclude_archs: 'linux_arm64;linux_amd64_musl;linux_arm64_musl;osx_amd64;osx_arm64;windows_amd64;windows_arm64;windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads'

  # ADVISORY canary on DuckDB main, the line beyond 2.0. Pushes to main and on
  # demand only: a push and a pull_request both fire on the same commit and a PR's
  # rollup includes both, so an unconditional job here would redden every PR for a
  # line nobody ships. `if:` rather than `continue-on-error:` because a job calling
  # a REUSABLE workflow accepts only a fixed set of keys.
  #   gh workflow run MainDistributionPipeline.yml --ref <branch>
  # zim carries the next job's vcpkg and arch settings here, for the same reasons.
  duckdb-main-canary:
    name: Build extension binaries (duckdb main canary)
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@main
    with:
      duckdb_version: main
      ci_tools_version: main
      extension_name: zim
      vcpkg_binary_sources: 'clear'
      exclude_archs: 'linux_arm64;linux_amd64_musl;linux_arm64_musl;osx_amd64;osx_arm64;windows_amd64;windows_arm64;windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads'
  duckdb-stable-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5-variegata
    with:
      duckdb_version: v1.5.5
      ci_tools_version: v1.5-variegata
      extension_name: zim
      # Disable the shared DuckDB binary cache: it hands back an icu (or host-tool)
      # artifact built with an incompatible toolchain, which poisons the icu build under
      # gcc-toolset-14 (the build fails only when the cache is consulted; a fresh build
      # of every dep succeeds). 'clear' forces building all deps from source.
      vcpkg_binary_sources: 'clear'
      # Windows isn't supported yet: libzim + xapian under MSVC/mingw need their own porting
      # work (mingw in particular fails to build the deps -- xapian's configure fails with
      # "C compiler cannot create executables" under the rtools mingw toolchain). Ships
      # Linux + macOS; revisit Windows later. (Wasm is likewise a documented open question.)
      exclude_archs: 'windows_amd64;windows_arm64;windows_amd64_mingw'

  code-quality-check:
    name: Code Quality Check
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@v1.5-variegata
    with:
      duckdb_version: v1.5.5
      ci_tools_version: v1.5-variegata
      extension_name: zim
      # format only: the tidy check configures CMake without vcpkg, so this extension's
      # required libzim (pkg-config) isn't found and tidy can't even configure.
      format_checks: 'format'

  # Guards the LINKED_LIBS class of WASM bug: the distribution workflow builds and
  # uploads the .wasm but never inspects or loads it, so a side module with unresolved
  # libzim/zstd/lzma symbols ships green. This downloads the v1.5.5 wasm artifacts and
  # statically checks no dependency symbol is imported-but-undefined (no runtime needed).
  # See test/wasm/. (A live duckdb-wasm load test is deferred until runtime ZIM reading
  # in wasm lands — libzim's local mmap path doesn't work in wasm.)
  wasm-symbol-check:
    name: WASM symbol resolution check
    needs: [duckdb-stable-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Download WASM artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: zim-v1.5.5-extension-wasm_*
          path: wasm-artifacts
      - name: Check for unresolved libzim/zstd/lzma symbols
        run: bash test/wasm/run_wasm_checks.sh wasm-artifacts

  # Remote full-text search can't be a sqllogictest (no server host), so run the
  # test/remote/remote_search.sh integration test against the built linux artifact +
  # a matching DuckDB CLI: serve the committed test.zim over http and assert a remote
  # zim_search returns the same hits as the local search (the reader-copy path).
  #
  # EVERY ARTIFACT IS TESTED, EACH WITH THE SHELL IT WAS BUILT AGAINST. This job used
  # to download every "*linux_amd64*" artifact and then test whichever one `find`
  # happened to return first, against a hardcoded v1.5.4 shell. That was harmless
  # while the stable build was the only artifact -- but once main grew a DuckDB-main
  # canary, a second artifact appeared and `find` picked it roughly at random. A
  # DuckDB-main extension cannot load into a v1.5.4 shell (an extension loads only
  # into the exact DuckDB it was built against), so the load failed, every query
  # returned nothing, and the script reported "missing expected hit" -- an ABI
  # mismatch wearing the costume of a silent wrong answer in remote search.
  #
  # So: iterate the artifacts explicitly, and derive each one's shell rather than
  # assuming. The distribution workflow ships a test-support bundle containing the
  # duckdb binary built from that same source tree, which is matching BY
  # CONSTRUCTION; use it when present and fall back to the released CLI named in the
  # artifact otherwise. If neither can be resolved, FAIL rather than test the wrong
  # pair. remote_search.sh itself now refuses to run before the extension loads and
  # httpfs installs, so the two environment failures can no longer masquerade as
  # missing search hits.
  remote-search-test:
    name: Remote search integration test
    # Waits for the next-line build and the main canary too, so their artifacts are
    # present rather than racing them -- otherwise "which artifacts exist" depends on
    # job timing. always() is required because the canary is SKIPPED on pull_request
    # and on non-main pushes (and the next job on branches with no PR), and a skipped
    # dependency would otherwise skip this job with it.
    needs: [duckdb-stable-build, duckdb-next-build, duckdb-main-canary]
    if: always() && needs.duckdb-stable-build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download linux extension artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*linux_amd64*"
          path: ext-artifacts
      - name: Fetch released DuckDB CLI (v1.5.5)
        run: |
          set -euo pipefail
          curl -fL -o duckdb.zip https://github.com/duckdb/duckdb/releases/download/v1.5.5/duckdb_cli-linux-amd64.zip
          unzip -o duckdb.zip -d duckdb-cli
          ./duckdb-cli/duckdb --version
      - name: Run remote search + stdout guards against every artifact
        run: |
          set -euo pipefail
          shopt -s nullglob
          tested=0
          for artdir in ext-artifacts/*/; do
            name="$(basename "$artdir")"
            ext="$(find "$artdir" \( -name 'zim.duckdb_extension' -o -name 'zim.duckdb_extension.gz' \) | head -1)"
            if [ -z "$ext" ]; then
              echo "::notice::$name carries no zim.duckdb_extension, skipping"
              continue
            fi
            if [ "${ext##*.}" = "gz" ]; then gunzip -kf "$ext"; ext="${ext%.gz}"; fi
            ext="$(readlink -f "$ext")"

            # Resolve the shell this artifact can actually load into.
            cli=""
            ts="$(find "$artdir" -name 'test-support.tar.gz' | head -1)"
            if [ -n "$ts" ]; then
              dest="shells/$name"
              mkdir -p "$dest"
              # The bundle is built from the same tree as the extension, so its
              # duckdb binary matches by construction whatever version that was.
              tar xzf "$ts" -C "$dest" release/duckdb
              cli="$(readlink -f "$dest/release/duckdb")"
            elif [[ "$name" == *v1.5.5* ]]; then
              cli="$PWD/duckdb-cli/duckdb"
            else
              echo "::error::no DuckDB shell available for artifact '$name'; refusing to test it against a mismatched shell"
              exit 1
            fi

            echo "=============================================================="
            echo "artifact:  $name"
            echo "extension: $ext"
            echo "shell:     $cli ($("$cli" --version))"
            echo "=============================================================="
            DUCKDB_BIN="$cli" ZIM_EXTENSION="$ext" bash test/remote/remote_search.sh
            # #21 guard: searching a no-stemmer-language archive must not leak
            # libzim's "No stemming ..." line to stdout (sqllogictest can't see stdout).
            # Needs no httpfs, so it runs on every artifact including the canary's.
            DUCKDB_BIN="$cli" ZIM_EXTENSION="$ext" bash test/no_stdout_pollution.sh
            # Writer counterpart of the #21 guard above: writing a ZIM must not leak
            # libzim's writer-side INFO() prints to stdout either.
            DUCKDB_BIN="$cli" ZIM_EXTENSION="$ext" bash test/no_writer_stdout_pollution.sh
            tested=$((tested + 1))
          done
          if [ "$tested" -eq 0 ]; then
            echo "::error::no artifact was tested"; find ext-artifacts -type f | head -50; exit 1
          fi
          echo "artifacts tested: $tested"

  # The parallel read_zim scan reads one shared libzim Archive from many threads
  # (see DESIGN.md). A ThreadSanitizer build of the extension runs the many-entry
  # parallel scan test (test/sql/zim_parallel.test, >4096 entries = multiple
  # in-flight morsels) to catch a data race in that concurrent read. Only the zim
  # extension + DuckDB are instrumented; the vcpkg deps are not (enough to catch
  # races in this codebase's own concurrency).
  thread-sanitizer:
    name: Thread sanitizer (parallel scan)
    runs-on: ubuntu-latest
    env:
      GEN: ninja
      THREADSAN: 1
      VCPKG_TARGET_TRIPLET: x64-linux
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake build-essential ccache pkg-config \
                                  autoconf automake autoconf-archive libtool zip unzip curl
      - name: Setup vcpkg
        run: |
          mkdir local_vcpkg_installation && cd local_vcpkg_installation
          git init
          git remote add origin https://github.com/microsoft/vcpkg.git
          git fetch --depth 1 origin 84bab45d415d22042bd0b9081aea57f362da3f35
          git checkout 84bab45d415d22042bd0b9081aea57f362da3f35
          ./bootstrap-vcpkg.sh
          echo "VCPKG_TOOLCHAIN_PATH=$PWD/scripts/buildsystems/vcpkg.cmake" >> "$GITHUB_ENV"
      - name: Build extension with ThreadSanitizer
        run: make release
      - name: Run parallel-scan test under ThreadSanitizer
        env:
          # Suppress libzim's own (mutex-guarded but uninstrumented) internal-cache
          # races; a race in this extension's code still fails. halt_on_error=1 so a
          # real race aborts the job.
          TSAN_OPTIONS: "halt_on_error=1 suppressions=${{ github.workspace }}/test/tsan.supp"
        # setarch -R disables ASLR: modern kernels randomize enough that tsan
        # otherwise aborts at startup with "unexpected memory mapping".
        run: setarch "$(uname -m)" -R ./build/release/test/unittest "test/sql/zim_parallel.test"

  # THE PIN EQUALS THE REGISTRY DEFAULT, AND THE WORKFLOW SHIPS EVERY LINE THE
  # REGISTRY BUILDS. Fleet rule (Teague, 2026-09-13): the duckdb submodule is
  # pinned at exactly the commit of the tag the stable build ships against, which
  # is also the version the community registry builds every extension with, and
  # this workflow also ships the next line the registry builds (build_next.yml).
  # Otherwise local builds and each repo's own CI artifacts carry a different
  # DuckDB than the served one, and extensions built in different repos cannot
  # co-load locally (the ABI is exact-version). Measured 2026-09-13: five sibling
  # repos were on a July dev commit, one on a v1.5.6-dev commit, one on DuckDB
  # main. Nothing but a check keeps this true. The second assertion keeps this
  # job's constants from drifting away from the `duckdb_version:` the build jobs
  # above actually use.
  duckdb-pin:
    name: DuckDB submodule pin equals the shipped tag
    # Name kept as-is even though the rule is now "pin equals the registry default":
    # required-check configuration may key on this job name.
    runs-on: ubuntu-latest
    env:
      DUCKDB_VERSION: v1.5.5
      DUCKDB_NEXT: v2.0-cyanoptera
      # Flip day (spec §3 step 3) keeps a duckdb-legacy-build at the outgoing version
      # for one release; set this to that version then so the stray-literal scan below
      # exempts it instead of flagging it. Empty the rest of the time.
      DUCKDB_LEGACY: ''
    steps:
      - uses: actions/checkout@v4
      - name: Compare the submodule pin with the tag's commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # One variable, one edit point: every sibling repo copies this job
          # verbatim, and the greps and the stray-literal scan below all read
          # this same file.
          wf=.github/workflows/MainDistributionPipeline.yml
          want=$(git ls-remote --tags https://github.com/duckdb/duckdb "refs/tags/${DUCKDB_VERSION}^{}" | cut -f1)
          [ -n "$want" ] || want=$(git ls-remote --tags https://github.com/duckdb/duckdb "refs/tags/${DUCKDB_VERSION}" | cut -f1)
          have=$(git ls-tree HEAD duckdb | awk '{print $3}')
          echo "shipped tag ${DUCKDB_VERSION} -> ${want}"
          echo "submodule pin          -> ${have}"
          [ -n "$want" ] || { echo "::error::could not resolve tag ${DUCKDB_VERSION} upstream"; exit 1; }
          [ "$want" = "$have" ] || { echo "::error::duckdb submodule pin ${have} is not the ${DUCKDB_VERSION} tag ${want}; run: git -C duckdb fetch --tags && git -C duckdb checkout ${DUCKDB_VERSION}"; exit 1; }
          n=$(grep -c "duckdb_version: ${DUCKDB_VERSION}$" "$wf" || true)
          [ "$n" -ge 1 ] || { echo "::error::no build job in this workflow ships duckdb_version: ${DUCKDB_VERSION}; this job's constant has drifted"; exit 1; }
          m=$(grep -c "duckdb_version: ${DUCKDB_NEXT}$" "$wf" || true)
          [ "$m" -ge 1 ] || { echo "::error::no build job in this workflow builds the next line duckdb_version: ${DUCKDB_NEXT}"; exit 1; }
          # NO OTHER DuckDB PATCH VERSION may drift from the shipped ${DUCKDB_VERSION}
          # anywhere else in this file: sibling workflows (yaml, mcp) embed a version
          # in artifact NAMES and CLI download URLs (e.g. `yaml-v1.5.4-extension-wasm_*`,
          # `releases/download/v1.5.4/duckdb_cli`) that the `duckdb_version:` greps above
          # cannot see, so a bump left them stale and this job went green over a red
          # build. Comment lines (first non-space char `#`) are exempt, and so are
          # `uses:` lines (a `- uses:` list item too): a third-party action pin like
          # `@v2.0.4` is not a DuckDB version. Branch/tag names like `v2.0-cyanoptera`
          # and `v1.5-variegata` have no third numeric component and so never match
          # this pattern. DUCKDB_LEGACY, when set (flip day, see above), is exempt too.
          bad=0
          while IFS=: read -r lineno line; do
            printf '%s\n' "$line" | grep -qE '^[[:space:]]*#' && continue
            printf '%s\n' "$line" | grep -qE '^[[:space:]]*-?[[:space:]]*uses:' && continue
            for v in $(printf '%s\n' "$line" | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' || true); do
              if [ "$v" != "$DUCKDB_VERSION" ]; then
                if [ -n "$DUCKDB_LEGACY" ] && [ "$v" = "$DUCKDB_LEGACY" ]; then
                  continue
                fi
                echo "::error::line ${lineno}: ${line} -- a DuckDB version literal that is not the shipped ${DUCKDB_VERSION}: derive it from the shipped version or bump it"
                bad=1
              fi
            done
          done < <(grep -nE 'v[0-9]+\.[0-9]+\.[0-9]+' "$wf" || true)
          [ "$bad" -eq 0 ] || exit 1
          # THE AUTHORITY is the registry's own files, not this job's constants: a
          # constant checked only against itself passes for a year after the registry
          # moves (panduck, 2026-09-13). Resolve main to a sha first so the raw fetches
          # are not served from the branch cache. THREE degraded paths, deliberately
          # different: UNREACHABLE (curl itself failed, HTTP code 000) is the world
          # being unavailable -> a NOTE, and the summary says the registry assertions
          # were not made, with only the local-constant assertions above run; a
          # non-2xx HTTP code (e.g. a renamed/removed registry file) is this check
          # asking the world a well-formed question and getting told no -> a FAILURE
          # naming the code and URL (a bare `curl -sf` would have mistaken this for
          # UNREACHABLE and measured nothing); REACHABLE, 2xx, BUT UNPARSEABLE is this
          # check being wrong about the file's content -> also a FAILURE.
          summary="${GITHUB_STEP_SUMMARY:-/dev/null}"
          base="https://raw.githubusercontent.com/duckdb/community-extensions"
          # An Authorization: Bearer header with an EMPTY token is not "no header": GitHub
          # answers 401 to it, worse than sending no header at all (confirmed empirically).
          # An unauthenticated local run (no GITHUB_TOKEN, which the docs tell maintainers
          # to run) would then always miss sha resolution and fall back to the `main` REF
          # NAME, comparing against whatever the branch URL's cache happens to be serving --
          # the exact staleness this sha-resolution step exists to avoid. So the header is
          # added only when a token is actually present; CI always has one.
          auth=(); [ -n "${GITHUB_TOKEN:-}" ] && auth=(-H "Authorization: Bearer ${GITHUB_TOKEN}")
          sha=$(curl -sf "${auth[@]}" https://api.github.com/repos/duckdb/community-extensions/commits/main | grep -m1 -o '"sha": *"[0-9a-f]*"' | grep -o '[0-9a-f]\{40\}' || true)
          f1=$(mktemp); f2=$(mktemp)
          # curl itself writes 000 to -w's %{http_code} when no HTTP response was
          # received at all (DNS failure, connection refused, timeout); `|| echo 000`
          # would DOUBLE that to "000000" (curl's own "000" plus the fallback's),
          # which then fails the equality check below and misreads UNREACHABLE as a
          # non-2xx code. `|| true` only stops `set -e` from killing the script on
          # curl's nonzero exit; the "000" already captured is curl's, unaltered.
          code1=$(curl -s -o "$f1" -w '%{http_code}' "${base}/${sha:-main}/.github/workflows/build.yml" || true)
          code2=$(curl -s -o "$f2" -w '%{http_code}' "${base}/${sha:-main}/.github/workflows/build_next.yml" || true)
          if [ "$code1" = "000" ] || [ "$code2" = "000" ]; then
            echo "::notice::could not reach the community registry; the pin was checked against the local constants only"
            mode="NOT checked against the registry (unreachable); local constants ${DUCKDB_VERSION}/${DUCKDB_NEXT} only"
          elif [ "${code1#2}" = "$code1" ]; then
            url="${base}/${sha:-main}/.github/workflows/build.yml"
            echo "::error::community registry returned HTTP ${code1} for ${url}"
            echo "duckdb-pin: FAILED, registry returned ${code1} for ${url}" >> "$summary"; exit 1
          elif [ "${code2#2}" = "$code2" ]; then
            url="${base}/${sha:-main}/.github/workflows/build_next.yml"
            echo "::error::community registry returned HTTP ${code2} for ${url}"
            echo "duckdb-pin: FAILED, registry returned ${code2} for ${url}" >> "$summary"; exit 1
          else
            body=$(cat "$f1")
            next_body=$(cat "$f2")
            registry=$(printf '%s' "$body" | grep -m1 -o "inputs.duckdb_version || 'v[0-9][0-9.]*'" | grep -o "'v[0-9][0-9.]*'" | tr -d "'" || true)
            registry_next=$(printf '%s' "$next_body" | grep -m1 -o "duckdb_version: *'v[0-9][0-9.]*-[a-z]*'" | grep -o "'v[^']*'" | tr -d "'" || true)
            if [ -z "$registry" ] || [ -z "$registry_next" ]; then
              echo "::error::community-extensions at ${sha:-main} was fetched but build.yml/build_next.yml carry no recognisable duckdb_version (default='${registry}', next='${registry_next}'); this check's parse is wrong about the registry, fix the check"
              echo "duckdb-pin: FAILED, registry files fetched but unparseable" >> "$summary"; exit 1
            fi
            if [ "$registry" != "$DUCKDB_VERSION" ] || [ "$registry_next" != "$DUCKDB_NEXT" ]; then
              echo "::error::the community registry builds default=${registry} next=${registry_next} (at ${sha:-main}) but this repo ships default=${DUCKDB_VERSION} next=${DUCKDB_NEXT}; update the pin, the constants and the build jobs to the registry's lines"
              echo "duckdb-pin: FAILED, registry ${registry}/${registry_next} vs repo ${DUCKDB_VERSION}/${DUCKDB_NEXT}" >> "$summary"; exit 1
            fi
            mode="checked against the registry (default ${registry}, next ${registry_next}, at ${sha:-main})"
          fi
          echo "duckdb-pin: OK, pin ${have:0:10} == ${DUCKDB_VERSION}; ${n} job(s) shipping ${DUCKDB_VERSION} and ${m} job(s) shipping ${DUCKDB_NEXT}; ${mode}" | tee -a "$summary"

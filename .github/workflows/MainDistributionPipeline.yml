#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  duckdb-stable-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5-variegata
    with:
      duckdb_version: v1.5.2
      ci_tools_version: v1.5-variegata
      extension_name: zim
      # Disable the shared DuckDB binary cache: it hands back an icu (or host-tool)
      # artifact built with an incompatible toolchain, which poisons the icu build under
      # gcc-toolset-14 (the build fails only when the cache is consulted; a fresh build
      # of every dep succeeds). 'clear' forces building all deps from source.
      vcpkg_binary_sources: 'clear'

  code-quality-check:
    name: Code Quality Check
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@v1.5-variegata
    with:
      duckdb_version: v1.5.2
      ci_tools_version: v1.5-variegata
      extension_name: zim
      # format only: the tidy check configures CMake without vcpkg, so this extension's
      # required libzim (pkg-config) isn't found and tidy can't even configure.
      format_checks: 'format'
